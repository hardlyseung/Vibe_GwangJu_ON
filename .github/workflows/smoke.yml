# 배포된 주소가 실제로 살아 있는지 확인한다.
#
# 왜 필요한가: 이 서비스는 2027-03-31 까지 사실상 무인으로 떠 있어야 하는데,
# 지금까지 배포 후 확인이 전적으로 사람 기억에 달려 있었다. 실제로 Gemini 모델
# 슬러그가 404 로 죽어 후보를 갈아끼운 이력이 있고(113c6d4, 721d312),
# 그때도 사용자가 알려주기 전까지 아무도 몰랐다.
#
# 중요 — 상태코드만 보면 안 된다. /api/chat 은 모델이 죽어도 "안내 문구"를 담아
# 200 을 돌려주는 경로가 있다(근거 부족·안전필터·빈 응답). 그게 의도된 설계지만,
# 감시 입장에서는 200 이 곧 정상이 아니라는 뜻이다. 그래서 본문의 grounded 까지 본다.

name: smoke

on:
  # Vercel 이 배포 결과를 알려줄 때
  deployment_status:
  # 아무 일이 없어도 하루 한 번. GitHub 는 60일간 저장소 활동이 없으면
  # 예약 워크플로를 자동 비활성화하고 소유자에게 메일을 보낸다 —
  # 18개월 무인 운영에서는 그 메일을 받을 수 있는 상태로 두는 것까지가 한 세트다.
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # 프리뷰 배포까지 검사하면 무료 할당량만 먹는다. 프로덕션 성공 건만 본다.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 대상 주소 결정
        id: target
        env:
          # deployment_status 의 target_url 은 쓰지 않는다. 그 값은 프로덕션
          # 별칭이 아니라 배포마다 새로 생기는 고유 주소
          # (vibe-gwang-ju-<해시>-<계정>.vercel.app)라서, Vercel 보호에 걸려
          # 302 로 로그인 화면으로 넘어간다. 첫 실행이 그렇게 실패했다.
          #
          # 우리가 살아 있는지 확인해야 하는 건 사용자가 실제로 여는 주소,
          # 즉 프로덕션 별칭 하나뿐이다. 주소가 바뀌면 저장소 변수
          # SITE_URL 에 넣으면 되고, 없으면 아래 기본값을 쓴다.
          FROM_VARS: ${{ vars.SITE_URL }}
          # 어느 배포가 이 실행을 촉발했는지는 기록만 남긴다.
          DEPLOY_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          URL="${FROM_VARS:-https://vibe-gwang-ju-on.vercel.app}"
          URL="${URL%/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "확인 대상: $URL"
          [ -n "$DEPLOY_URL" ] && echo "(촉발한 배포: $DEPLOY_URL)"
          exit 0

      - name: 첫 화면이 뜨는가
        run: |
          URL="${{ steps.target.outputs.url }}"
          # 배포 성공 알림이 와도 프로덕션 별칭이 새 배포로 넘어가는 데 몇 초
          # 걸린다. 그 틈에 한 번 실패했다고 빨간불을 켜면 오탐만 쌓인다.
          code=""
          for attempt in 1 2 3; do
            # curl 은 연결 실패 시에도 %{http_code} 로 000 을 쓴다.
            # 여기에 폴백을 또 붙이면 "000000" 이 되어 로그가 헷갈린다.
            code=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 20 "$URL/") || true
            code="${code:-000}"
            echo "GET / → $code (시도 $attempt)"
            [ "$code" = "200" ] && break
            [ $attempt -lt 3 ] && sleep 10
          done

          if [ "$code" != "200" ]; then
            echo "::error::첫 화면이 $code 를 돌려줬습니다. 302 면 그 주소가 Vercel 보호에 걸린 것이니 SITE_URL 이 프로덕션 별칭인지 확인하세요."
            exit 1
          fi
          # 200 인데 내용이 비어 있는 경우를 거른다.
          grep -q "광주" /tmp/home.html || {
            echo "::error::200 이지만 본문에 기대한 내용이 없습니다."; exit 1; }

      - name: 거점 데이터를 받을 수 있는가
        run: |
          URL="${{ steps.target.outputs.url }}"
          code=$(curl -sS -o /tmp/places.json -w '%{http_code}' --max-time 20 "$URL/data/places.json")
          echo "GET /data/places.json → $code"
          [ "$code" = "200" ] || { echo "::error::거점 데이터가 $code."; exit 1; }
          node -e "
            const d = require('/tmp/places.json');
            if (!Array.isArray(d.spots) || !d.spots.length) {
              console.error('::error::배포된 places.json 의 spots 가 비어 있습니다.');
              process.exit(1);
            }
            console.log('거점 ' + d.spots.length + '곳');
          "

      # .vercelignore 는 한 줄만 잘못 써도 css/style.css 나 js/app.js 를 통째로
      # 배포에서 빼 버린다. 그러면 첫 화면은 여전히 200 이고 본문에 "광주"도
      # 들어 있어서 앞 검사를 그대로 통과한다 — 스타일과 동작만 사라진 채로.
      # 그래서 화면이 실제로 거는 주소를 전부 눌러 본다.
      - name: 화면이 거는 주소가 전부 열리는가
        run: |
          URL="${{ steps.target.outputs.url }}"
          bad=0
          for path in css/style.css js/app.js data/places.json data/exhibitions.json geocode.html; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL/$path") || code="000"
            if [ "$code" = "200" ]; then
              echo "  200  /$path"
            else
              echo "  $code  /$path"
              bad=1
            fi
          done
          if [ "$bad" != "0" ]; then
            echo "::error::배포에서 빠진 파일이 있습니다. .vercelignore 규칙이 화면에 필요한 파일을 걸러내고 있는지 확인하세요."
            exit 1
          fi

      - name: AI 해설이 실제로 답하는가
        run: |
          URL="${{ steps.target.outputs.url }}"
          # 5·18 관련 거점은 안전필터에 정상적으로 걸릴 수 있어 오탐이 된다.
          # 근거 자료가 넉넉하면서 중립적인 거점(희경루)으로 묻는다.
          body='{"placeId":4,"question":"여기는 어떤 곳인가요?","persona":"basic","language":"ko"}'
          code=$(curl -sS -o /tmp/chat.json -w '%{http_code}' --max-time 40 \
            -X POST "$URL/api/chat" \
            -H "Content-Type: application/json" \
            -H "Origin: $URL" \
            -H "Referer: $URL/" \
            -d "$body")
          echo "POST /api/chat → $code"
          cat /tmp/chat.json

          if [ "$code" != "200" ]; then
            echo "::error::/api/chat 이 $code 를 돌려줬습니다. 502 면 모델명이 더 이상 유효하지 않다는 뜻이라 MODEL_CANDIDATES 를 확인하세요."
            exit 1
          fi

          node -e "
            const r = require('/tmp/chat.json');
            // 200 이어도 reason 이 붙어 있으면 모델이 아니라 폴백이 답한 것이다.
            if (r.grounded !== true) {
              console.error('::error::200 이지만 근거 기반 답변이 아닙니다 (reason=' + (r.reason || '없음') + '). 모델·키·근거 자료를 확인하세요.');
              process.exit(1);
            }
            if (!r.answer || !r.answer.trim()) {
              console.error('::error::답변 본문이 비어 있습니다.');
              process.exit(1);
            }
            // source 는 {name, date} 객체다. 그대로 이어붙이면 [object Object] 가 찍혀
            // 어느 자료로 답했는지 로그에서 알 수 없다.
            const src = r.source && r.source.name ? r.source.name : '없음';
            console.log('답변 ' + r.answer.length + '자, 출처 ' + src);
          "

      # 지도는 브라우저에서만 뜨므로 CI 가 직접 확인할 수 없다. 대신 카카오가
      # 그 도메인에 SDK 를 내주는지는 물어볼 수 있고, 도메인 미등록이
      # 지도 실패의 가장 흔한 원인이다.
      #
      # 카카오는 Referer 로 도메인을 정확히 가린다(등록 안 된 주소에는
      # 401 AccessDeniedError "domain mismatched!"). 실제로 확인하고 넣은
      # 검사다. 그래서 등록 안 된 주소로도 한 번 물어 본다 — 그쪽까지
      # 200 이 오면 카카오가 더 이상 안 가린다는 뜻이고, 이 검사는 그날부터
      # 아무것도 지켜주지 못하므로 그 사실을 로그에 남긴다.
      - name: 카카오 지도 SDK 를 내주는가
        run: |
          URL="${{ steps.target.outputs.url }}"
          SDK="https://dapi.kakao.com/v2/maps/sdk.js?appkey=91c073489a8d4aaf847cf49ef9bbb679&autoload=false"

          ours=$(curl -sS -o /tmp/sdk.js -w '%{http_code}' --max-time 20 \
            -H "Referer: $URL/" "$SDK") || ours="000"
          echo "우리 도메인($URL) → $ours"

          if [ "$ours" != "200" ]; then
            echo "본문: $(head -c 200 /tmp/sdk.js)"
            echo "::error::카카오가 이 도메인에 지도 SDK 를 내주지 않습니다. 개발자 콘솔 [내 애플리케이션 > 플랫폼 > Web]에 $URL 이 등록돼 있는지, [제품 설정 > 카카오맵]이 켜져 있는지 확인하세요."
            exit 1
          fi

          # 받아온 게 진짜 SDK 인지. 200 이어도 오류 문서일 수 있다.
          grep -q "window.kakao" /tmp/sdk.js || {
            echo "본문: $(head -c 200 /tmp/sdk.js)"
            echo "::error::200 이지만 받은 내용이 지도 SDK 가 아닙니다."; exit 1; }

          # 이 검사가 여전히 의미 있는지 확인한다.
          bogus=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Referer: https://not-registered.example.com/" "$SDK") || bogus="000"
          echo "등록 안 된 도메인 → $bogus (401 이어야 이 검사가 유효)"
          [ "$bogus" = "200" ] && echo "::warning::카카오가 등록 안 된 도메인에도 SDK 를 내줍니다. 이 검사는 더 이상 도메인 등록을 보증하지 못합니다."

          echo "지도 SDK 정상"

      - name: 허용되지 않은 출처를 막는가
        run: |
          URL="${{ steps.target.outputs.url }}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST "$URL/api/chat" \
            -H "Content-Type: application/json" \
            -H "Origin: https://evil.example.com" \
            -d '{"placeId":4,"question":"테스트"}')
          echo "다른 출처에서 POST → $code"
          [ "$code" = "403" ] || { echo "::error::출처 검증이 동작하지 않습니다 ($code, 403 이어야 함)."; exit 1; }
